name: Run Automated Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]


jobs:
    test_suite:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository Code
              uses: actions/checkout@v4

            - name: Configure Python Environment
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'
            
            - name: Install Development Testing Tools
              run: |
                python -m pip install --upgrade pip
                pip install pytest
            
            - name: Execute Validation Test Framework
              env:
                PYTHONPATH: src
              run: |
                pytest
